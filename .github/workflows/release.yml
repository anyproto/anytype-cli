name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  repository_dispatch:
    types: [trigger-from-heart]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'repository_dispatch' && 'stable' || github.ref }}
  cancel-in-progress: false

jobs:
  build-all-platforms:
    name: Build all platforms
    runs-on: macos-15

    outputs:
      version: ${{ steps.build-vars.outputs.version }}
      commit: ${{ steps.build-vars.outputs.commit }}
      revision: ${{ steps.build-vars.outputs.revision }}
      build-time: ${{ steps.build-vars.outputs.time }}
      heart-version: ${{ github.event.client_payload.version }}
      previous-tag: ${{ steps.resolve-tag.outputs.previous_tag }}
      skip: ${{ steps.bump-check.outputs.skip || 'false' }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false

      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            if [ -z "${{ github.event.client_payload.version }}" ]; then
              echo "❌ client_payload.version is required"
              exit 1
            fi
            SOURCE_TAG="${{ github.event.client_payload.version }}"

            # Only stable releases (vX.X.X) trigger a bump. Skip prereleases
            # like -alpha, -beta, -rc, etc. so they are never committed or tagged.
            if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "⏭️  $SOURCE_TAG is not a stable release (vX.X.X); skipping bump"
              exit 0
            fi
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"

            LAST_TAG="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

            if [ -z "$LAST_TAG" ]; then
              MAJOR=0
              MINOR=0
              PATCH=0
            else
              BASE="${LAST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            fi

            PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
          else
            TAG="${GITHUB_REF_NAME}"
            LAST_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${LAST_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (previous: ${LAST_TAG:-none})"

      - name: Update anytype-heart version
        if: github.event_name == 'repository_dispatch' && steps.resolve-tag.outputs.is_prerelease != 'true'
        shell: bash
        run: |
          go get github.com/anyproto/anytype-heart@${{ github.event.client_payload.version }}
          go mod tidy

      - name: Check if heart bump is needed
        id: bump-check
        if: github.event_name == 'repository_dispatch'
        env:
          HEART_VERSION: ${{ github.event.client_payload.version }}
          IS_PRERELEASE: ${{ steps.resolve-tag.outputs.is_prerelease }}
        shell: bash
        run: |
          if [ "${IS_PRERELEASE}" == "true" ]; then
            echo "${HEART_VERSION} is a prerelease; skipping commit and release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- go.mod go.sum; then
            echo "Already at ${HEART_VERSION}; skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit bump and create release tag
        if: github.event_name == 'repository_dispatch' && steps.bump-check.outputs.skip != 'true'
        env:
          TAG: ${{ steps.resolve-tag.outputs.tag }}
          HEART_VERSION: ${{ github.event.client_payload.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add go.mod go.sum
          git commit -m "Bump anytype-heart to ${HEART_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Set build variables
        id: build-vars
        if: steps.bump-check.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "version=${{ steps.resolve-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "time=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "revision=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install dependency mingw
        if: steps.bump-check.outputs.skip != 'true'
        run: |
          brew update
          brew tap FiloSottile/musl-cross
          # musl-cross lives in a third-party tap; the runner sets
          # HOMEBREW_REQUIRE_TAP_TRUST, so the tap must be trusted before install.
          brew trust FiloSottile/musl-cross
          brew install mingw-w64 musl-cross

      - name: Cross-compile all platforms in parallel
        if: steps.bump-check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.build-vars.outputs.version }}
          GIT_STATE: clean
          COMMIT: ${{ steps.build-vars.outputs.commit }}
          BUILD_TIME: ${{ steps.build-vars.outputs.time }}
        run: |
          make cross-compile
          ls -la dist/

      - name: Compress binaries
        if: steps.bump-check.outputs.skip != 'true'
        run: |
          cd dist
          cp anytype-darwin-amd64 anytype && tar czf "../anytype-cli-${{ steps.build-vars.outputs.version }}-darwin-amd64.tar.gz" anytype && rm anytype
          cp anytype-darwin-arm64 anytype && tar czf "../anytype-cli-${{ steps.build-vars.outputs.version }}-darwin-arm64.tar.gz" anytype && rm anytype
          cp anytype-windows-amd64.exe anytype.exe && zip "../anytype-cli-${{ steps.build-vars.outputs.version }}-windows-amd64.zip" anytype.exe && rm anytype.exe
          cp anytype-linux-amd64 anytype && tar czf "../anytype-cli-${{ steps.build-vars.outputs.version }}-linux-amd64.tar.gz" anytype && rm anytype
          cp anytype-linux-arm64 anytype && tar czf "../anytype-cli-${{ steps.build-vars.outputs.version }}-linux-arm64.tar.gz" anytype && rm anytype
          cd ..
          ls -la anytype-cli-*

      - name: Upload artifacts
        if: steps.bump-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anytype-cli-releases
          path: |
            anytype-cli-*.tar.gz
            anytype-cli-*.zip

  create-release:
    name: Create GitHub release
    needs: build-all-platforms
    if: needs.build-all-platforms.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.release-info.outputs.body }}
      html_url: ${{ steps.release-info.outputs.html_url }}
      tag_name: ${{ steps.release-info.outputs.tag_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: anytype-cli-releases
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Compose release body
        if: github.event_name == 'repository_dispatch'
        shell: bash
        env:
          HEART_VERSION: ${{ needs.build-all-platforms.outputs.heart-version }}
          TAG: ${{ needs.build-all-platforms.outputs.version }}
          PREVIOUS_TAG: ${{ needs.build-all-platforms.outputs.previous-tag }}
        run: |
          {
            echo "## What's Changed"
            echo "* Update anytype-heart to ${HEART_VERSION}"
            if [ -n "${PREVIOUS_TAG}" ]; then
              echo ""
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            fi
          } > release-body.md

      - name: Create Release & Upload Assets (heart trigger)
        id: create-release-dispatch
        if: github.event_name == 'repository_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-all-platforms.outputs.version }}
          name: ${{ needs.build-all-platforms.outputs.version }}
          files: artifacts/anytype-cli-*
          body_path: release-body.md
          generate_release_notes: false
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release & Upload Assets (tag push)
        id: create-release-tag
        if: github.event_name != 'repository_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-all-platforms.outputs.version }}
          name: ${{ needs.build-all-platforms.outputs.version }}
          files: artifacts/anytype-cli-*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.build-all-platforms.outputs.version, '-rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release info
        id: release-info
        uses: actions/github-script@v9
        with:
          script: |
            const release_id = Number('${{ steps.create-release-dispatch.outputs.id || steps.create-release-tag.outputs.id }}');
            const { data } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id
            });
            core.setOutput('body', data.body || '');
            core.setOutput('html_url', data.html_url);
            core.setOutput('tag_name', data.tag_name);

  push-docker-image:
    name: Build Docker image and push to registry
    needs:
      - build-all-platforms
      - create-release
    if: needs.build-all-platforms.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Set deploy-platforms
        run: |
          echo "DEPLOY_PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV

      - name: Normalization of the release version
        id: release-version
        shell: bash
        run: |
          tag="${{ needs.build-all-platforms.outputs.version }}"
          ver="${tag#v}"
          echo "RELEASE_VERSION=${ver}" >> "$GITHUB_OUTPUT"

      - name: Checkout Dockerfile
        uses: actions/checkout@v7
        with:
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: anytype-cli-releases
          path: artifacts

      - name: Extract linux binaries
        run: |
          tar -xzf artifacts/anytype-cli-${{ needs.build-all-platforms.outputs.version }}-linux-amd64.tar.gz
          mv anytype anytype-linux-amd64
          tar -xzf artifacts/anytype-cli-${{ needs.build-all-platforms.outputs.version }}-linux-arm64.tar.gz
          mv anytype anytype-linux-arm64
          ls -la anytype-linux-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.DEPLOY_PLATFORMS }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.build-all-platforms.outputs.version }}
            ghcr.io/${{ github.repository }}:v${{ steps.release-version.outputs.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Anytype CLI - Command-line interface for Anytype with embedded gRPC server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.release-version.outputs.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ needs.build-all-platforms.outputs.revision }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.DEPLOY_PLATFORMS }}
          push: true
          provenance: false
          tags: |
            docker.io/${{ github.repository }}:latest
            docker.io/${{ github.repository }}:${{ needs.build-all-platforms.outputs.version }}
            docker.io/${{ github.repository }}:v${{ steps.release-version.outputs.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Anytype CLI - Command-line interface for Anytype with embedded gRPC server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.release-version.outputs.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ needs.build-all-platforms.outputs.revision }}

  notify:
    name: Notify Slack
    needs:
      - build-all-platforms
      - create-release
      - push-docker-image
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (workflow result)
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          notification_title: "${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '❌' || '✅' }} {workflow} {repo}"
          message_format: |
            *Release:* <${{ needs.create-release.outputs.html_url }}|${{ needs.create-release.outputs.tag_name || 'none' }}>
            *Description:*
            ${{ needs.create-release.outputs.body || 'no changes, build skipped' }}
          footer: "Linked Repo <{repo_url}|{repo}> | <{run_url}|View Workflow Run>"
        env:
          SLACK_WEBHOOK_URL: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && secrets.SLACK_WEBHOOK_URL_ALERTS || secrets.SLACK_WEBHOOK_URL_RELEASE_TRAIN }}
